server:
  port: 8086  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: course-service
  main:
    allow-circular-references: true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
          - data-id: shared-redis.yaml # 共享redis配置
          - data-id: shared-mybatis.yaml # 共享mybatis配置
          - data-id: shared-logs.yaml # 共享日志配置
          - data-id: shared-feign.yaml # 共享feign配置
          - data-id: shared-mq.yaml # 共享MQ配置
          - data-id: shared-seata.yaml # 共享seata配置
          - data-id: shared-xxljob.yaml # 共享seata配置
tj:
  swagger:
    enable: true
    package-path: com.tianji.course.controller
    title: 天机学堂 - 课程系统接口文档
    description: 该服务包含课程管理相关功能
    contact-name: fzc70
    contact-url: https://github.com/fzc70/tianji
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: false
  jdbc:
    database: tj_course
